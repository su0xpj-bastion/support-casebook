name: suite-mcp-server-qa
on:
  push:
    paths:
      - "suites/mcp-server-qa/**"
      - ".github/workflows/suite-mcp-server-qa.yml"
  pull_request:
    paths:
      - "suites/mcp-server-qa/**"
      - ".github/workflows/suite-mcp-server-qa.yml"
defaults:
  run:
    working-directory: suites/mcp-server-qa
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: conformance, validation, fuzzing, auth, cancellation, security, drift (stdio + HTTP)
        run: npx vitest run
      - name: fault matrix (12 server bugs, each caught by exactly its tests)
        run: npx tsx scripts/fault-matrix.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-matrix
          path: suites/mcp-server-qa/reports/fault-matrix.md
