  provider: openai
  gold: config.service_tier
  why: "400 after admin change; customer thinks SDK bug"
  text: "Email: after upgrading the SDK we get 400 Invalid `service_tier` argument even with service_tier auto. Admin restricted tiers on the project last week."
- id: ADV-20
  provider: anthropic
  gold: provider.timeout
  why: "504 on long non-streaming call"
  text: "Slack: long non-streaming summaries fail with 504 timeout_error and we see three different request-ids per call."
